# Prepis `sensor.zaluzie_cielovy_stav` z /config/configuration.yaml.
# FÁZA 1: žiadna zmena správania. Každý riadok má zodpovedať jednej vetve
# dnešnej šablóny. Overuje to migračná brána v tests/parity/.

blinds:
  - {entity: cover.kuchyna_zaluzia_3_6,        facade_azimuth: 180}
  - {entity: cover.obyvacka_zaluzia_3,         facade_azimuth: 180}
  - {entity: cover.kuchyna_zaluzia_1_4,        facade_azimuth: 90}
  - {entity: cover.kuchyna_zaluzia_2_5,        facade_azimuth: 90}
  - {entity: cover.obyvacka_zaluzia_dvere_1_3, facade_azimuth: 270}
  - {entity: cover.obyvacka_zaluzia_dvere_2,   facade_azimuth: 270}
  - {entity: cover.peter_zal,                  facade_azimuth: 270}
  - {entity: cover.mimka_zal,                  facade_azimuth: 270}
  - {entity: cover.spalna_zaluzia_2,           facade_azimuth: 270}
  - {entity: cover.spalna_zaluzia_dvere_1,     facade_azimuth: 270}

# Zóny sedia na svetové strany 1:1, preto stačí facade_azimuth na žalúzii.
# tolerance 45 dáva presne dnešné pásma: [45,135) [135,225) [225,315).
zones:
  spolocne: {members: [cover.kuchyna_zaluzia_3_6, cover.obyvacka_zaluzia_3]}
  kvety:    {members: [cover.kuchyna_zaluzia_1_4, cover.kuchyna_zaluzia_2_5]}
  terasa:   {members: [cover.obyvacka_zaluzia_dvere_1_3]}
  terasa2:  {members: [cover.obyvacka_zaluzia_dvere_2]}
  peter:    {members: [cover.peter_zal],  occupants: [peter]}
  mimka:    {members: [cover.mimka_zal],  occupants: [mimka]}
  spalna:   {members: [cover.spalna_zaluzia_2, cover.spalna_zaluzia_dvere_1],
             occupants: [pavel, majka]}

values:
  kvety_poz: {entity: input_number.kvety_pozicia_zaluzie, default: 34}

conditions:
  # Two different things, deliberately kept apart: the sky says it is night,
  # and the person says "close everything now". Either one means mode `noc`.
  je_noc:
    condition: or
    conditions:
      # Sunset to sunrise-15min. The offset is measured, not chosen: the old
      # flag went off 11-20 min before sunrise, on a lux threshold this
      # replaces. See docs/rationale.md.
      - {condition: sun, before: sunrise, before_offset: -900, after: sunset}
      # The user's own emergency brake, and it stays a helper on purpose --
      # a command, not a derived state. Voice "zapni nočný režim" writes it.
      - {condition: state, entity_id: input_boolean.cover_down, state: "on"}

  # POZOR: nesmie sa viazať len na stav panela. Pri spustenom alarme je stav
  # `triggered`, nie `armed_vacation` — matica by spadla na `bezny_den`
  # a prázdny dom by sa otvoril (falošný tamper 2026-08-13).
  alarmo_vacation:
    condition: or
    conditions:
      - {condition: state, entity_id: alarm_control_panel.alarmo, state: armed_vacation}
      - condition: and
        conditions:
          - {condition: state, entity_id: alarm_control_panel.alarmo, state: triggered}
          - {condition: state, entity_id: alarm_control_panel.alarmo,
             attribute: arm_mode, state: armed_vacation}

  teplotna_ochrana:
    condition: state
    entity_id: input_boolean.teplotna_ochrana_dom
    state: "on"

  # `default: 999` = mŕtvy senzor sa tvári ako víchor. Zodpovedá `| float(999)`.
  vietor_ok:
    condition: or
    conditions:
      - condition: and
        conditions:
          - {condition: numeric_state, default: 999, below: 40,
             entity_id: sensor.netatmo_veterny_senzor_rychlost_vetra}
          - {condition: numeric_state, default: 999, below: 55,
             entity_id: sensor.netatmo_veterny_senzor_sila_narazov}
      - {condition: numeric_state, default: 999, below: 30,
         entity_id: weather.forecast_home, attribute: wind_speed}

  # Zamračené počas horúčavy => otvoriť naplno. Podmienka `rezim == horucava`
  # je zabezpečená tým, že sa používa výhradne v pravidlách režimu `horucava`.
  pocasie_otvorene:
    condition: and
    conditions:
      - {condition: state, entity_id: sun.sun, state: above_horizon}
      - {condition: state, entity_id: weather.openweathermap,
         state: [cloudy, rainy, pouring, lightning-rainy, snowy-rainy]}
      - !ref vietor_ok

  # Lighting SUN vetva `light-on` už stiahla terasu a kvety, ale `cover_down`
  # (a s ním režim `noc`) príde až o 20–40 min. V tom okne matica nesmie
  # vracať nič hore. Prah 12:30 je ten istý, aký má vetva `light-on`.
  # First clause derived from the sky, not from `input_boolean.lighting_on`
  # that `Lighting SUN` used to write. Measured deviation: docs/rationale.md.
  vecer:
    condition: and
    conditions:
      - condition: or
        conditions:
          # Dark window across midnight: on at sunset-20min, held after
          # midnight by `before: sunrise`, off at sunrise+10min.
          - {condition: sun, before: sunrise, before_offset: 600,
                             after: sunset, after_offset: -1200}
          # An overcast evening crosses the threshold first -- 4 of 13.
          - {condition: numeric_state, default: 99999, below: 2800,
             entity_id: sensor.predsien_dvere_senzor_illuminance}
      - {condition: state, entity_id: input_boolean.cover_down, state: "off"}
      - {condition: time, after: "12:30"}

  # 2026-08-27: `terasa` (dverová _1_3) teraz pozná stav terasových dverí.
  # `off` = zatvorené. `unavailable`/`unknown` sa zámerne NEROVNÁ `"off"`,
  # takže padajú do "nie sú zatvorené" — rovnaký bezpečný smer (nechať vetvu
  # bez dverí), aký má configuration.yaml pre mŕtvy/neznámy senzor.
  dvere_zatvorene:
    condition: state
    entity_id: binary_sensor.obyvacka_dvere_senzor
    state: "off"

  # `kvety_on` (bez `nie_`) sa nikde nepoužíva -- žiadne pravidlo sa naň
  # neodkazuje, len jeho opak `nie_kvety_on` nižšie. Odstránené (fáza 6,
  # task 3): pomenovaná podmienka, na ktorú sa nič neodkazuje, nie je ani
  # skratka, ani dokumentácia, len mŕtva položka v zozname 25 podmienok.
  nie_kvety_on: {condition: state, entity_id: input_boolean.kvety_on, state: "off"}

  rucne_kuchyna:
    condition: state
    entity_id: input_boolean.zaluzie_kuchyna_rucne
    state: "on"

  hocikto_doma:     {condition: state, entity_id: binary_sensor.is_home, state: "on"}
  # `nikto_doma` (opak vyššie) sa použil len raz (`horucava.spolocne`) a
  # nemení polaritu ani nekombinuje nič -- inlinované priamo do toho
  # pravidla (fáza 6, task 3): meno tu neniesie nič, čo by `entity_id`/`state`
  # na mieste použitia nepovedali rovnako jasne.

  # "Everyone is up". Read straight off the bed sensor rather than the helper
  # `automation.Sleeping` used to derive from it -- same sensor, same 2 min
  # debounce, one fewer thing that has to exist. The sensor is **Peter's bed**
  # and the name overpromises, but it overpromised identically before: the
  # helper was derived from this one sensor too. The `for:` is not decoration:
  # this gates the only rule that opens the terrace fully, and a bed sensor
  # flickering for thirty seconds would move it twice. See docs/rationale.md.
  vstali:
    condition: state
    entity_id: binary_sensor.postel_occupancy_postel_2
    state: "off"
    for: 120

  doma_peter: {condition: state, entity_id: binary_sensor.peter_home, state: "on"}
  nie_peter:  {condition: state, entity_id: binary_sensor.peter_home, state: "off"}
  doma_mimka: {condition: state, entity_id: binary_sensor.mimka_home, state: "on"}
  nie_mimka:  {condition: state, entity_id: binary_sensor.mimka_home, state: "off"}
  doma_spalna:
    condition: or
    conditions:
      - {condition: state, entity_id: binary_sensor.pavel_home, state: "on"}
      - {condition: state, entity_id: binary_sensor.majka_home, state: "on"}
  nie_spalna:
    condition: and
    conditions:
      - {condition: state, entity_id: binary_sensor.pavel_home, state: "off"}
      - {condition: state, entity_id: binary_sensor.majka_home, state: "off"}

  # `akt_peter`/`akt_mimka`/`akt_spalna` (bez `nie_`) boli tiež nepoužité --
  # odstránené z toho istého dôvodu ako `kvety_on` vyššie. Ich opaky
  # (`nie_akt_*`) sa používajú dvakrát každý (`horucava.*` aj `bezny_den.*`),
  # takže tie zostávajú pomenované.
  nie_akt_peter: {condition: state, entity_id: input_boolean.zaluzie_aktivna_peter,  state: "off"}
  nie_akt_mimka: {condition: state, entity_id: input_boolean.zaluzie_aktivna_mimka,  state: "off"}
  nie_akt_spalna: {condition: state, entity_id: input_boolean.zaluzie_aktivna_spalna, state: "off"}

  # ---- Podmienky, ktoré číta LEN `guards:` ------------------------------
  # Žiadne pravidlo sa na ne neodkazuje a nemá — sú to poistky, nie
  # rozhodnutia. Matica sa o dvere ani o saunu opiera výhradne cez
  # `dvere_zatvorene` vyššie (a to len v `horucava.terasa`).

  # #9 (Wind cover protection, automations.yaml:1520). Tri nezávislé zdroje,
  # a to PRAHY SPÚŠŤANIA (40/55/35), nie prahy upokojenia (40/55/30), ktoré
  # drží `vietor_ok` vyššie pre maticu. Nemiešať: keby poistka používala
  # nižší prah predpovede, prestala by platiť skôr, než sa vietor upokojí.
  # `default: 0`, not 999 -- see docs/rationale.md, 2026-08-31. Both Netatmo
  # sensors are dead (battery at 0%), so `default: 999` meant "always a gale"
  # and the wind guard forced the whole house open, permanently. The old
  # `Wind cover protection` survives it only because it uses TRIGGERS: a dead
  # sensor never crosses a threshold. A condition has no such luxury, so here
  # a dead sensor is "no information" and the live forecast carries the guard.
  vietor_silny:
    condition: or
    conditions:
      - {condition: numeric_state, default: 0, above: 40,
         entity_id: sensor.netatmo_veterny_senzor_rychlost_vetra}
      - {condition: numeric_state, default: 0, above: 55,
         entity_id: sensor.netatmo_veterny_senzor_sila_narazov}
      - {condition: numeric_state, default: 0, above: 35,
         entity_id: weather.forecast_home, attribute: wind_speed}

  # Dvere pre poistku: pýtame sa „je ZATVORENÉ?", nie „je otvorené?".
  # Živý config to má naopak — `zavriet_bezpecne` (scripts.yaml:1244) aj
  # `zaluzie_zavriet` (scripts.yaml:1839) testujú `is_state(...,'on')`, takže
  # `unavailable` dverový senzor žalúziu spustí. Tu je polarita obrátená
  # zámerne a je to jediné miesto, kde sa poistka od živého configu líši:
  # pre interlock je mŕtvy senzor dôvod NEzatvárať (docs/rationale.md,
  # „Why an unreadable position makes a directional guard fire").
  dvere_nezatvorene:
    condition: not
    conditions: [!ref dvere_zatvorene]

  spalna_dvere_nezatvorene:
    condition: not
    conditions:
      - {condition: state, entity_id: binary_sensor.spalna_dvere_senzor_2, state: "off"}

  # `binary_sensor.sauna_running` je UI template helper (`.storage`, nie YAML —
  # inventúra ho preto nenašla). Overené na živom dome 2026-08-30:
  #   (mode aj temp mŕtve) OR (mode != 'off') OR (temp > 50)
  # Je teda FAIL-CLOSED: keď zomrú oba zdroje, hlási `on` a poistka drží.
  # Prah 50 °C je zmeraný, nie odhadnutý: päť týždňov histórie oddeľuje
  # seansy (30→50 °C za ~6 min, 6 dní) od kabíny ohriatej slnkom
  # (30→45 °C za ~5 h, 11 dní) bezchybne. Preto sa tu smie testovať
  # priamo stav — netreba k nemu žiadnu ďalšiu poistku.
  sauna_bezi:  {condition: state, entity_id: binary_sensor.sauna_running, state: "on"}
  sauna_nebezi:
    condition: not
    conditions: [!ref sauna_bezi]

  # #11 (automations.yaml:8702). Nastavuje ho automatizácia, ktorá „človeka"
  # dokazuje NEGATÍVNE (žiadna zo štyroch automatík nebeží) — `context.user_id`
  # hlas ani vypínač nemajú. Je to iný príznak než `rucne_kuchyna`, ktorý
  # číta matica.
  # Read off the blind, not off a helper. Nothing in this configuration ever
  # sends the flower blinds above `kvety_poz` (34), so a position over 45 means
  # somebody else put it there -- and unlike the helper it cannot disagree with
  # the blind it describes. Measured: the helper did, on 3 of 8 transitions,
  # and twice it cleared while the blind was still at 100. See
  # docs/rationale.md, "Why the manual raise is read off the blind".
  kvety_rucny_override:
    condition: or
    conditions:
      - {condition: numeric_state, above: 45, default: 0,
         entity_id: cover.kuchyna_zaluzia_1_4, attribute: current_position}
      - {condition: numeric_state, above: 45, default: 0,
         entity_id: cover.kuchyna_zaluzia_2_5, attribute: current_position}

modes:
  - {id: noc,       when: !ref je_noc}
  - {id: dovolenka, when: !ref alarmo_vacation}
  - {id: horucava,  when: !ref teplotna_ochrana}
  - {id: bezny_den}

rules:
  # ---- NOC: nič sa nehýbe, ani po príchode ------------------------------
  # Bolo tu 7 zoznamov, jeden na zónu, všetky s tým istým jediným pravidlom
  # -- v noci sa nič nehýbe, bez ohľadu na zónu. Odkedy pravidlo bez zóny
  # (kľúč "*", `const.RULE_DEFAULT_ZONE`) platí ako default pre celý režim
  # (fáza 6, task 1: `engine._apply_rules`), stačí ho napísať raz. Žiadna zóna
  # v `noc` nemá vlastný zoznam, takže default nič nezatieni -- `validate()`
  # na tomto prepise hlási 0 chýb aj 0 varovaní, presne ako predtým.
  "noc.*": [{then: {position: keep, tilt: keep}}]

  # ---- DOVOLENKA: spálne úplne zavreté, spoločné lamely 50 -------------
  # Príchodová varianta je zhodná so stavovou (zp = z), preto žiadne
  # `events:` pravidlá.
  # `spolocne`/`terasa`/`terasa2` majú identický jednoriadkový zoznam a rovnako
  # `peter`/`mimka`/`spalna` -- vyzerá to ako ten istý prípad ako `noc` vyššie.
  # NEKOLABUJE do defaultu -- overené (fáza 6, task 3), že pridanie "*" defaultu sem zakaždým
  # zdvihne `validate()` varovanie `unreachable_rule` na `dovolenka.kvety`,
  # lebo tá zóna má vlastný nepodmienený catch-all (`!ref kvety_poz`) s inou
  # hodnotou než ktorýkoľvek z dvoch kandidátov na default -- `_check_default_
  # shadowed_by_zone` naň zareaguje bez ohľadu na to, ktorá skupina sa zvolí
  # za default, a rovnako by zareagoval aj na tú skupinu, čo defaultom
  # nebude. Zero-warnings je tu tvrdá podmienka (Task 3), takže tieto dva
  # zoznamy zostávajú explicitné aj po tejto fáze -- vidno tri rôzne koncové
  # akcie (keep/50, 0/0, kvety_poz/50) v jednom režime a model default vie
  # niesť len jednu z nich naraz.
  dovolenka.spolocne: [{then: {position: keep, tilt: 50}}]
  dovolenka.kvety:
    - {if: !ref nie_kvety_on, then: {position: keep, tilt: keep}}
    - {then: {position: !ref kvety_poz, tilt: 50}}
  dovolenka.terasa:  [{then: {position: keep, tilt: 50}}]
  dovolenka.terasa2: [{then: {position: keep, tilt: 50}}]
  dovolenka.peter:   [{then: {position: 0, tilt: 0}}]
  dovolenka.mimka:   [{then: {position: 0, tilt: 0}}]
  dovolenka.spalna:  [{then: {position: 0, tilt: 0}}]

  # ---- HORÚČAVA --------------------------------------------------------
  # `pocasie_otvorene` MUSÍ predchádzať každému `sun_hits_target`: šablóna
  # pri zamračení nastaví `strana = 'ziadna'`, takže slnečná vetva vtedy
  # neplatí. Opačné poradie zhodí paritu.
  horucava.spolocne:
    - {events: [arrival], if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {events: [arrival], then: {position: keep, tilt: 50}}
    - {if: {condition: state, entity_id: binary_sensor.is_home, state: "off"},
       then: {position: 0, tilt: 0}}
    - {if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: keep, tilt: 50}}
    - {then: {position: keep, tilt: 100}}

  # Príchodové pravidlá kopírujú lamely zo stavovej vetvy zámerne: stará
  # šablóna posiela kľúč `tilt` z `z` aj pre príchodovú variantu.
  # POZOR: `zp['kvety']` v šablóne je `N if rucne_kuchyna else (KV0 if vecer
  # else (T100 if pocasie_otvorene else KV))` — `T100` je doslovná konštanta
  # `{'akcia':'tilt','hodnota':100}`, NIE `KV100`, takže pri zamračenej
  # horúčave dostane kuchyňa lamely 100 aj keď je `kvety_on` vypnuté. `nie_kvety_on`
  # preto smie skratovať len vetvu `vecer` (kde je akcia `KV0`, gated) a
  # koncový fallback (`KV`, tiež gated) — nie vetvu `pocasie_otvorene`.
  horucava.kvety:
    - {events: [arrival], if: !ref rucne_kuchyna, then: {position: keep, tilt: keep}}
    - {events: [arrival], if: [!ref vecer, !ref nie_kvety_on], then: {position: keep, tilt: keep}}
    - {events: [arrival], if: !ref vecer,            then: {position: !ref kvety_poz, tilt: 0}}
    - {events: [arrival], if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {events: [arrival], if: !ref nie_kvety_on,     then: {position: keep, tilt: keep}}
    - {events: [arrival], if: {condition: sun_hits_target},
       then: {position: !ref kvety_poz, tilt: 0}}
    - {events: [arrival], then: {position: !ref kvety_poz, tilt: 100}}
    - {if: !ref rucne_kuchyna,    then: {position: keep, tilt: keep}}
    - {if: !ref nie_kvety_on,     then: {position: keep, tilt: keep}}
    - {if: !ref vecer,            then: {position: !ref kvety_poz, tilt: 0}}
    - {if: !ref pocasie_otvorene, then: {position: !ref kvety_poz, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: !ref kvety_poz, tilt: 0}}
    - {then: {position: !ref kvety_poz, tilt: 100}}

  # Terasa (dverová _1_3) sa ráno nevytiahne sama — až keď domácnosť vstala.
  horucava.terasa:
    - {events: [arrival], if: !ref vecer,            then: {position: keep, tilt: keep}}
    - {events: [arrival], if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {events: [arrival], then: {position: 100, tilt: keep}}
    # 2026-08-27: dvere zatvorené => tieni presne ako `terasa2` (rovnaký
    # strana-based výpočet), bez ohľadu na vecer/pocasie_otvorene/hocikto/
    # vstali — tie riešia LEN vytiahnutie hore, a to nehrozí, keď je cieľ
    # dole. `dvere_zatvorene` musí byť prvá podmienka v reťazci (je to
    # najvonkajšia `if` v šablóne) a `pocasie_otvorene` musí predchádzať
    # `sun_hits_target` v rámci nej z rovnakého dôvodu ako v `terasa2`
    # nižšie: `strana` je 'ziadna' pri zamračení, takže slnečná vetva by
    # inak vyhrala aj vtedy, keď byť nemá. Platí len pre stavovú variantu —
    # `zp` v šablóne o dverách nič nevie.
    # 2026-09-01: `vecer` posunuty PRED dverove vetvy. Povodna uvaha (komentar
    # vyssie a v configuration.yaml) bola, ze `vecer` chrani len proti
    # VYTIAHNUTIU a pri zatvorenych dverach je ciel dole, takze konflikt
    # nehrozi. Prehliadla lamely: vetva `light-on` da obom dverovym zaluziam
    # tilt 100, aby obyvacka nebola potme (oprava 21. 8.), a matica im ho
    # vratila na 50 osemnast minut pred zapadom.
    - {if: !ref vecer,            then: {position: keep, tilt: keep}}
    - {if: [!ref dvere_zatvorene, !ref pocasie_otvorene], then: {position: 0, tilt: 100}}
    - {if: [!ref dvere_zatvorene, {condition: sun_hits_target}], then: {position: 0, tilt: 50}}
    - {if: !ref dvere_zatvorene, then: {position: 0, tilt: 100}}
    - {if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: 0, tilt: 50}}
    - {if: [!ref hocikto_doma, !ref vstali], then: {position: 100, tilt: keep}}
    - {if: !ref hocikto_doma,     then: {position: keep, tilt: keep}}
    - {then: {position: keep, tilt: 50}}

  # Terasa2 (_2_) zostáva počas horúčavy dole celý deň.
  horucava.terasa2:
    # 2026-09-01: `vecer` tu chybal, hoci `bezny_den.terasa2` ho ma. Vo `vecer`
    # dala vetva `light-on` tejto zaluzii lamely 100, aby obyvacka nebola potme
    # (oprava 21. 8.) -- a matica jej ich o 18 min pred zapadom vratila na 50.
    # Tienit 18 minut pred zapadom nema co chranit a len zhasina svetlo.
    - {if: !ref vecer, then: {position: keep, tilt: keep}}
    - {if: !ref pocasie_otvorene, then: {position: 0, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: 0, tilt: 50}}
    - {then: {position: 0, tilt: 100}}

  horucava.peter:
    - {events: [arrival], then: {position: keep, tilt: 100}}
    - {if: !ref nie_peter,     then: {position: 0, tilt: 0}}
    - {if: !ref nie_akt_peter, then: {position: keep, tilt: keep}}
    - {if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: keep, tilt: 50}}
    - {then: {position: keep, tilt: 100}}

  horucava.mimka:
    - {events: [arrival], then: {position: keep, tilt: 100}}
    - {if: !ref nie_mimka,     then: {position: 0, tilt: 0}}
    - {if: !ref nie_akt_mimka, then: {position: keep, tilt: keep}}
    - {if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: keep, tilt: 50}}
    - {then: {position: keep, tilt: 100}}

  horucava.spalna:
    - {events: [arrival], if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {events: [arrival], then: {position: keep, tilt: 50}}
    - {if: !ref nie_spalna,     then: {position: 0, tilt: 0}}
    - {if: !ref nie_akt_spalna, then: {position: keep, tilt: keep}}
    - {if: !ref pocasie_otvorene, then: {position: keep, tilt: 100}}
    - {if: {condition: sun_hits_target}, then: {position: keep, tilt: 50}}
    - {then: {position: keep, tilt: 100}}

  # ---- BEŽNÝ DEŇ -------------------------------------------------------
  # `teplotna_ochrana` je tu z definície režimu OFF, takže starý fallback
  # `pozicia_tilt_ciel` (= 100 keď je ochrana off) je konštanta 100.
  bezny_den.spolocne: [{then: {position: keep, tilt: 100}}]

  bezny_den.kvety:
    - {if: !ref rucne_kuchyna, then: {position: keep, tilt: keep}}
    - {if: !ref nie_kvety_on,  then: {position: keep, tilt: keep}}
    - {if: !ref vecer,         then: {position: !ref kvety_poz, tilt: 0}}
    - {then: {position: !ref kvety_poz, tilt: 100}}

  # `terasa` a `terasa2` sú identické, rovnaký prípad ako `dovolenka` vyššie:
  # `bezny_den.kvety` má vlastný nepodmienený catch-all (`!ref kvety_poz`,
  # iná hodnota než čokoľvek tu), takže "*" default pre `bezny_den` by
  # rovnako zdvihol `unreachable_rule` na `kvety` bez ohľadu na obsah --
  # overené rovnako ako pri `dovolenka`. Zostáva explicitné zdvojenie.
  bezny_den.terasa:
    - {if: !ref vecer, then: {position: keep, tilt: keep}}
    - {then: {position: 100, tilt: keep}}

  bezny_den.terasa2:
    - {if: !ref vecer, then: {position: keep, tilt: keep}}
    - {then: {position: 100, tilt: keep}}

  bezny_den.peter:
    - {events: [arrival], then: {position: keep, tilt: 100}}
    - {if: [!ref doma_peter, !ref nie_akt_peter], then: {position: keep, tilt: keep}}
    - {then: {position: keep, tilt: 100}}

  bezny_den.mimka:
    - {events: [arrival], then: {position: keep, tilt: 100}}
    - {if: [!ref doma_mimka, !ref nie_akt_mimka], then: {position: keep, tilt: keep}}
    - {then: {position: keep, tilt: 100}}

  bezny_den.spalna:
    - {events: [arrival], then: {position: keep, tilt: 100}}
    - {if: [!ref doma_spalna, !ref nie_akt_spalna], then: {position: keep, tilt: keep}}
    - {then: {position: keep, tilt: 100}}

# ---- POISTKY ----------------------------------------------------------
# Zdroj: `/config/docs/superpowers/specs/2026-08-29-inventura-poistiek.md`
# (13 skutočných poistiek), prečítané a overené proti živému
# `automations.yaml` / `scripts.yaml` 2026-08-30. Kde sa inventúra a živý
# config rozišli, platí živý config — rozdiely sú pomenované nižšie.
#
# Poistky sa vyhodnocujú MIMO `evaluate()` (`guards.screen` pred ním,
# `guards.review` po ňom), takže tento blok neposúva ani jedno rozhodnutie
# migračnej brány.
#
# PORADIE JE VÝZNAM: prvá poistka, ktorá sadne, vyhráva — presne ako
# pravidlá, bez číselných priorít. Dnes v dome rozhodcu niet vôbec: VAC
# disarm vie otvoriť terasu presne vtedy, keď ju vetrová ochrana zatvára
# alebo keď na nej sedí 3-hodinové saunové čakanie (inventúra, prierezový
# nález 4). Tu je rozhodcom tento zoznam.
#
# ČO SA SEM NEDÁ NAPÍSAŤ (nefalšuje sa to, len sa to pomenuje):
#
#  - #13 „VAC auto-on/off, vetva home" — je to UDALOSŤ (disarm alarmu), nie
#    trvalý interlock. Guard nemá `events:` a v dome neexistuje príznak,
#    ktorý by „práve sme prišli" držal; viazať to na `alarm_control_panel`
#    v stave `disarmed` by znamenalo držať terasu otvorenú celý deň.
#
#  - #12, spálňové routovanie (`zaluzie_zavriet`/`zaluzie_otvorit` vyhadzujú
#    spálňu a nechajú ju `script.spalna_zatvorenie`) — je to vlastnosť
#    VOLACEJ CESTY, nie stavu sveta. `when` je podmienka nad `World`; nič v
#    dome nehovorí „toto volanie prišlo z hlasu". Preto tu nie je ani jedna
#    poistka so `stage: input`.
#
#  - #12, ochrana kvetov („kým je `kvety_on`, mení sa LEN tilt, nie výška") —
#    to je skip na JEDNEJ OSI. Poistka, ktorá sadne, ovláda celú `Action`
#    (docs/rationale.md, „Why a guard that fires governs the whole action"),
#    takže „nechaj výšku, ale lamely nastav" sa povedať nedá. V matici to
#    zatiaľ drží `bezny_den.kvety` / `horucava.kvety` samo (`position:
#    !ref kvety_poz`), takže sa nič nestráca — ale je to vlastnosť pravidiel.
#
#  - #10 „Kvety - strážca pozície" ako celok — kľúčuje na polohe SVOJEJ
#    žalúzie („nad 45 % dlhšie než 10 min", „pod 20 %"). Jedna poistka mieri
#    na obe kuchynské žalúzie naraz a `when` nevie povedať „poloha práve
#    tohto cieľa"; a 10-minútová hysteréza sa v podmienke povedať nedá vôbec.
#    Jeho užitočná polovica („drž pozíciu z helpera") NIE JE interlock — to
#    už vracia engine sám (`!ref kvety_poz` v oboch denných režimoch), a
#    prepočet pri každej zmene stavu je ten strážca. Zostáva len #11 nižšie.
#
#  - #9, „vietor je pod prahom SÚVISLE 5 minút" — `repeat/until` s `for: 5 min`.
#    Podmienka nemá trvanie, takže poistka na prahu bude kmitať. Jediné, čo
#    to dnes tlmí, je `planner.DEAD_BAND`.
#
#  - #8, „v kresle 5 minút nikto" — to isté trvanie, ten istý dôvod.
#    Okamžitá polovica (`kreslo_senzor_occupancy == off`) by sa napísať dala,
#    ale do spoločnej terasovej poistky nepatrí: #6/#7 (Lighting SUN) kreslo
#    netestujú, takže by sa začali odkladať aj bežné večerné zatvorenia.
#
#  - #3 a #1787900000002 (poistky po reštarte) — nie sú to poistky nad
#    coverom, sú to hliadky nad `wait_for_trigger`, ktorý reštart zabije.
#    Táto schéma ich pohltila do `recheck_every` (docs/rationale.md, „Why
#    restart resilience is a guard field, not a second automation").
#
#  - #16 (len loguje), #17 (mŕtvy skript) a #15 (`teplotna_ochrana_zatvor`,
#    bez volajúceho) nie sú poistky. #15 je štvrtá kópia toho istého
#    pravidla, ktorej dodnes chýba spálňová vetva — presne to, čo jeden
#    zoznam ruší.
#
# `cover.obyvacka_zaluzia_dvere_2` ZÁMERNE nie je v žiadnej dverovej
# poistke: napriek názvu visí nad OKNOM, nie nad otváracím krídlom (overené
# užívateľom 30. 8. 2026, poznámka aj v scripts.yaml:1824). Výskyt entity v
# Lighting SUN a vo vetrovej ochrane NIE JE dôkaz, že ju niekto stráži na
# dverovom senzore — a jej vyradenie by len znamenalo, že sa cez leto pri
# otvorených dverách nedá zatvoriť. Dverové žalúzie sú práve dve:
# `cover.obyvacka_zaluzia_dvere_1_3` a `cover.spalna_zaluzia_dvere_1`.
guards:
  # #9 — Wind cover protection. Prvá zámerne: je to jediný interlock, ktorý
  # musí platiť aj vtedy, keď je všetko ostatné pokazené, a `description` aj
  # návrhový dokument ho volajú „najvyššia priorita". Bez `targets`, teda celý
  # dom — živá automatizácia mieri na `cover.dom` + obe kvetinové + tri
  # `area_id`, čo je to isté. `tilt` zostáva `keep`: `cover.open_cover` žiadny
  # tilt neposiela a z hornej polohy sa uhol nastaviť ani nedá.
  #
  # To, že je napísaná PRVÁ, nahrádza podmienku „vietor je pod prahom", ktorú
  # dnes musí mať #10 (a nemá ju #13) — kolízia sa rieši poradím, nie tým, že
  # si každá poistka zopakuje podmienky tých ostatných.
  - name: vietor - otvor celý dom
    policy: force
    applies_to: any
    when: !ref vietor_silny
    then: {position: 100}

  # #11 — človek vytiahol kvetinovú žalúziu rukou; strážca (#10) ju už nesmie
  # stiahnuť späť.
  #
  # `stage: output`, hoci v dome je to filter VSTUPU (`zony_kvety` vyhodí
  # žalúziu zo zoznamu ešte pred volaním `script.zaluzie_uplatnit`) a hoci
  # `docs/rationale.md` uvádza práve tento filter ako príklad vstupnej fázy.
  # Dôvod je poradie: `review()` preberá `screening.outcomes` a cieľ, ktorý si
  # nárokovala vstupná fáza, už druhýkrát nesúdi — vstupná poistka teda
  # prebíja KAŽDÚ výstupnú bez ohľadu na to, kde je v zozname napísaná.
  # So `stage: input` by táto poistka prebila aj vetrovú ochranu a rukou
  # vytiahnutá žalúzia by vo víchrici zostala vonku. V dome to nehrozí, lebo
  # strážca má vietor vo vlastných podmienkach; tu to rieši poradie — a to
  # funguje len v rámci jednej fázy.

  - name: kvety - clovek ich vytiahol rukou
    policy: skip
    stage: output
    applies_to: any
    targets: [kvety]
    when: !ref kvety_rucny_override

  # #1 + #5 + #6 + #7 + #8 + #14 (terasová polovica) — „nespúšťaj dverovú
  # žalúziu na otvorené dvere ani na bežiacu saunu", sedem nezávislých kópií
  # v jednom riadku.
  #
  # `defer`, nie `skip`, hoci `zavriet_bezpecne` (#1) je skip: skip zabudne,
  # defer si pamätá a zatvorí, keď prekážka pominie. Presne to robia štyri zo
  # siedmich kópií (#7 a #8 s 3 h, #2 a #4 bez limitu) a `skip`-ové kópie sa
  # spoliehajú na to, že maticu niekto neskôr prepočíta. Jeden zoznam si musí
  # vybrať jeden tvar — a toto je ten, čo prežije večer.
  #
  # 3 h a `abandon` sú doslova #7/#8: `timeout: {hours: 3}` +
  # `continue_on_timeout: false`. `recheck_every: 900` je pohltená #3.
  # `applies_to: closing` = klesajúca POLOHA, nie lamely: cesta hore aj tilt
  # sú aj dnes bez prekážky (inventúra, prierezový nález 2).
  - name: terasa - dvere alebo sauna
    policy: defer
    applies_to: closing
    targets: [terasa]
    when:
      condition: or
      conditions: [!ref dvere_nezatvorene, !ref sauna_bezi]
    max_wait: 10800
    on_timeout: abandon
    recheck_every: 900

  # #2 — „Obývačka dvere auto": kým sú terasové dvere otvorené, žalúzia je
  # HORE. Napísaná AŽ ZA odkladom vyššie, a to je jediné, čo ju drží pri
  # živote: `applies_to: any` by inak zobralo aj zatváracie rozhodnutia a
  # odklad by nikdy nesadol.
  #
  # `sauna_nebezi` je doslovná podmienka spustenia tejto automatizácie
  # (`binary_sensor.sauna_running == off`). POZOR: inventúra tu uvádza
  # `sensor.isauna_temperature_2 below 40` — to už neplatí, prepnuté
  # 2026-08-29, lebo prah 40 °C sa mýlil v 11 zo 17 prípadov a automatizácia
  # bola celé horúce poobedie vypnutá. Živý config vyhráva.
  #
  # ZOSTÁVAJÚCA DIERA, prenesená vedome: počas skutočnej seansy túto žalúziu
  # nedrží hore nikto (`automation.sauna_on_dvere_open` je vypnutá od 3/2025 a
  # menuje neexistujúcu entitu). Odklad vyššie ju aspoň nezatvorí.
  - name: terasove dvere otvorene - drz zaluziu hore
    policy: force
    applies_to: any
    targets: [terasa]
    when:
      condition: and
      conditions: [!ref dvere_nezatvorene, !ref sauna_nebezi]
    then: {position: 100}

  # #1 (spálňová polovica) + #14 (`script.spalna_zatvorenie`) — tá istá vec
  # bez saunového člena: spálňová terasa saunu nemá.
  #
  # `max_wait: null` = čakaj bez limitu. Je to HODNOTA, nie vynechanie —
  # #4 čaká bez limitu zámerne („rozhodnutie užívateľa 29. 8.: kým sú dvere
  # otvorené, žalúzia zostáva hore"). `on_timeout` sa pri `null` nedosiahne
  # nikdy, ale schéma ho žiada napísať; `abandon` preto, že keby sem niekto
  # neskôr dopísal konečný limit, `proceed` by žalúziu spustil na dvere,
  # ktoré sa dovtedy nemuseli zavrieť.
  #
  # Cieľ je ENTITA, nie zóna: zóna `spalna` obsahuje aj
  # `cover.spalna_zaluzia_2`, ktorá s dverami nemá nič spoločné.
  - name: spalna - terasove dvere
    policy: defer
    applies_to: closing
    targets: [cover.spalna_zaluzia_dvere_1]
    when: !ref spalna_dvere_nezatvorene
    max_wait: null
    on_timeout: abandon
    recheck_every: 900

  # #4 — „Spálňa dvere", obývačkový vzor pre spálňu. Za odkladom z rovnakého
  # dôvodu ako #2.
  #
  # Inventúra pri #4 hlási dva defekty: mŕtvy `continue_on_timeout: true` bez
  # `timeout` a chýbajúcu poistku po reštarte. ANI JEDEN UŽ NEPLATÍ —
  # automatizácia bola 2026-08-29 prepísaná na štruktúru obývačky (mŕtvy kľúč
  # je preč) a `automation` id `1787900000002` „Spálňa dvere - poistka po
  # reštarte" existuje (automations.yaml:8784). Živý config vyhráva.
  - name: spalnove dvere otvorene - drz zaluziu hore
    policy: force
    applies_to: any
    targets: [cover.spalna_zaluzia_dvere_1]
    when: !ref spalna_dvere_nezatvorene
    then: {position: 100}
