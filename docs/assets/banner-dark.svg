<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Cover Logic</title>
  <desc id="d">A window with angled blind slats and the sun behind them, next to the project name.</desc>
  <defs>
    <clipPath id="win"><rect x="96" y="56" width="208" height="208" rx="10"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g clip-path="url(#win)">
