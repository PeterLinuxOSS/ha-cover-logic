      <polygon points="96,220.0 304,213.0 304,221.2 96,228.2"/>
      <polygon points="96,234.0 304,226.4 304,234.9 96,242.5"/>
      <polygon points="96,248.0 304,239.8 304,248.6 96,256.8"/>
      <polygon points="96,262.0 304,253.2 304,262.2 96,271.0"/>
