  <text x="372" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#8b949e" opacity=".85">Rules, modes and interlocks · sun geometry · a trace of every move</text>
  <rect x="1032" y="32" width="208" height="40" rx="20" fill="none" stroke="#f5a623" stroke-width="2"/>
  <text x="1136" y="58" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f5a623">for Home Assistant</text>
