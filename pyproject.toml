[project]
name = "cover-logic"
version = "0.1.0"
description = "Universal rule-based cover (blind) controller for Home Assistant"
# Home Assistant 2026.8.0 itself requires Python >=3.14.2. The floor here is
# lower on purpose: the decision core (`custom_components/cover_logic/`) is
# pure Python with no Home Assistant imports and is meant to be testable
# standalone, including on whatever Python a contributor's machine happens to
# have -- see the CI matrix below, which covers both this floor and the real
# Home Assistant runtime.
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
# Home Assistant itself, for `tests/ha/`. A separate extra rather than part
# of `dev` because it needs Python >= 3.14.2, which this project's floor
# (3.12) does not meet -- so `pip install -e '.[dev]'` has to keep working
# on the older interpreters the matrix still covers.
ha = ["homeassistant>=2026.8"]

# Without this, setuptools auto-discovery sees `custom_components`, `fixtures`
# and `tests` as competing top-level packages and `pip install -e .` fails with
# "Multiple top-level packages discovered in a flat-layout". Nothing here is a
# distributable package — the integration is loaded by Home Assistant from
# `custom_components/`, not installed from a wheel.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components", "tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # aiohttp deprecation raised from inside `homeassistant.components.http`,
    # which `homeassistant.components.sensor` pulls in transitively. It is not
    # our code and we cannot fix it. Without this, importing `SensorEntity`
    # fails collection -- and a warning we have no control over would end up
    # dictating which base class the production sensor uses, which is the wrong
    # way round.
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
]
markers = [
    "slow: full-space runs; the default run DOES include this marker -- it exists only so it can be opted out explicitly with `-m \"not slow\"`. `addopts` has no such flag on purpose: the migration gate this marks is the project's central guarantee and is meant to run every time.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

# Selected explicitly: ruff's default rule set changes between releases, so
# without this a fresh ruff in CI flags things a local run does not, and the
# lint job's verdict depends on which version happened to be installed.
#
# This is Home Assistant core's own `select` list (from core's `pyproject.toml`
# on `dev`), taken as the starting point so this integration is linted the way
# an approved core integration is. `DTZ` is intentionally narrow here exactly
# as it is in core: only DTZ003/DTZ004/DTZ011 are selected, not the naive-
# datetime rules (DTZ001/DTZ005/DTZ006/...) -- `World.now` is a naive local
# datetime on purpose, mirroring Jinja's `now()`, and the migration gate
# depends on that equivalence holding.
[tool.ruff.lint]
select = [
    "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011",
    "E", "F", "F541", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG",
    "N804", "N805", "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "PYI", "RET", "RSE", "RUF", "S107", "S102", "S103", "S108", "S301", "S306",
    "S307", "S313", "S314", "S315", "S316", "S317", "S318", "S319", "S601",
    "S602", "S604", "S608", "S609", "SIM", "SLF", "SLOT", "T100", "T20", "TC",
    "TID", "TRY", "UP", "UP031", "UP032", "W",
]

ignore = [
    # flake8-type-checking wants these imports deferred into an
    # `if TYPE_CHECKING:` block. In core that avoids paying for heavy or
    # circular imports (other integrations, voluptuous schemas, etc.) at
    # runtime. Neither applies here: this package has no Home Assistant
    # imports at all (see model.py's own docstring), the handful of flagged
    # imports are between this project's own tiny modules with no cycle, and
    # `from __future__ import annotations` is deliberately absent (core bans
    # it -- see pyproject.toml `requires-python`). Without that future
    # import, a TYPE_CHECKING-only import breaks at class- or def-time for
    # every annotation that is not a quoted string, which is exactly the
    # eager-evaluation behaviour Step 3 of the style pass chose to keep.
    # Deferring these imports would trade a real readability regression
    # (quoting annotations everywhere) for a benefit (avoiding an import
    # this module doesn't have a problem with) that does not exist here.
    "TC001",
    "TC003",

    # The "too many X" family (arguments, branches, return statements,
    # positional args, statements, boolean expressions, public methods) and
    # mccabe complexity (C901). Core disables this whole family for
    # readability rather than tuning per-function thresholds; the same
    # tradeoff applies here even more directly; `evaluate_condition`'s branch
    # count is one flat dispatch over condition kinds (conditions.py), and
    # `_evaluate_zone`/`_apply_rules` in engine.py carry `config`, `rules`,
    # `world`, `target/zone`, `mode`, `zone_id` because that is the full,
    # genuinely-needed context for one rule evaluation -- splitting either
    # apart to satisfy a line-count metric would create indirection with no
    # reader benefit, in code the migration gate depends on staying obviously
    # correct.
    "C901",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0916",
    "PLR0917",

    # TRY300/TRY301 ask for `try`/`except` control flow to be restructured
    # (move a statement into an `else:` block; abstract a `raise` into an
    # inner function). The one production case (engine.py `_evaluate_zone`)
    # is intentional and already documented in the function's own docstring:
    # `EngineError` must escape a broad `except Exception` uncontained, and
    # the plain `raise` / `except EngineError: raise` pair right next to each
    # other is the clearest way to say that. `tests/scenarios.py`'s
    # backtracking search (`_require`) uses the same shape for the same
    # reason -- it is parity-support code the migration gate depends on, and
    # restructuring its try/except boundaries for a style rule risks changing
    # which exceptions get caught where, for a cosmetic gain.
    "TRY300",
    "TRY301",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["cover_logic"]

[tool.ruff.lint.per-file-ignores]
# Test functions document themselves by name (the project's own convention
# throughout `tests/`, e.g. `test_ref_truncates_toward_zero_like_jinjas_int_filter`)
# rather than by docstring, so pydocstyle's missing-docstring rules do not
# apply here. Test assertions and fixtures also routinely compare against
# literal expected values (positions, counts, timestamps); naming every one
# of those a constant would hurt readability rather than help it, so
# PLR2004 (magic value) is exempt here too.
"tests/**" = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    # D205 (blank line between summary and body) is exempt here too: several
    # test/harness docstrings (tests/scenarios.py, tests/test_scenarios.py,
    # tests/test_validation.py) explain a fixture or a backtracking search in
    # one dense opening paragraph rather than a one-line summary, which reads
    # better for what they are -- test documentation, not the public API
    # surface `docs/rationale.md` and the production docstrings serve.
    "D205",
    "PLR2004",
]
