[project]
name = "cover-logic"
version = "0.1.0"
description = "Universal rule-based cover (blind) controller for Home Assistant"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["custom_components"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
