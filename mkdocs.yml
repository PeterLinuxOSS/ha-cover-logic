site_name: Cover Logic
site_url: https://peterlinuxoss.github.io/ha-cover-logic/
repo_url: https://github.com/PeterLinuxOSS/ha-cover-logic
edit_uri: edit/main/docs/site/
docs_dir: docs/site
strict: true
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
