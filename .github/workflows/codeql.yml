name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published rule finds old code without waiting for a push.
    - cron: "24 6 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
