name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is this project's floor (see `requires-python` in
        # pyproject.toml); 3.14 is the version Home Assistant 2026.8 itself
        # requires. Both ends, plus the version in between, are covered.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # tests/parity is excluded on purpose: the migration gate renders the
      # live Jinja template out of /config/configuration.yaml, which only
      # exists on the Home Assistant host. It is the project's central
      # guarantee and must be run locally before any release.
      - run: python -m pytest tests/ -q --ignore=tests/parity

  # `tests/ha/` guards every module with `pytest.importorskip("homeassistant")`,
  # so without Home Assistant installed those files collect ZERO tests and
  # report neither a pass nor a skip -- the suite looks green while the whole
  # Home Assistant layer (config flow, subentry flows, options flow, entry
  # migration) goes unchecked. This job is what actually runs them. It is
  # separate from the matrix above because Home Assistant needs Python
  # >= 3.14.2, which this project's own floor does not.
  pytest-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev,ha]"
      # No extra "did anything run?" check needed: pytest exits 5 on "no tests
      # collected", so if the import guard skips everything this step fails
      # rather than passing silently -- which is the whole point of the job.
      - run: python -m pytest tests/ha -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check .
      - run: ruff format --check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
